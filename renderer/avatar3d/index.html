<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarah Avatar</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
                 font-family: system-ui, sans-serif; }
    #sarah-avatar { width: 100%; height: 100%; display: block; }
    #status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
              background: rgba(20, 20, 30, 0.75); color: #fff; padding: 8px 14px;
              border-radius: 8px; font-size: 14px; max-width: 90%; text-align: center; }
    #status.error { background: rgba(140, 30, 40, 0.85); }
    #dev-panel { position: fixed; top: 8px; right: 8px; width: 300px; max-height: 90%;
                 overflow: auto; background: rgba(20, 20, 30, 0.85); color: #eee;
                 padding: 8px 12px; border-radius: 8px; font-size: 13px; }
    #dev-panel h3 { margin: 10px 0 4px; font-size: 13px; color: #9cf; }
    #dev-panel .row { display: flex; flex-wrap: wrap; gap: 4px; }
    #dev-panel button { background: #334; color: #fff; border: 1px solid #556;
                        border-radius: 4px; padding: 3px 7px; cursor: pointer; font-size: 12px; }
    #dev-panel button:hover { background: #446; }
    #dev-panel input { width: 100%; box-sizing: border-box; padding: 5px; border-radius: 4px;
                       border: 1px solid #556; background: #223; color: #fff; }
  </style>
</head>
<body>
  <canvas id="sarah-avatar"></canvas>
  <div id="status" hidden></div>
  <div id="dev-panel" hidden></div>
  <!-- Built from src/ with: npm run build:avatar -->
  <script type="module" src="dist/sarah-avatar.js"></script>
</body>
</html>
